# DictMaster Worker config.
# IMPORTANT: `name` must match the Worker name in the Cloudflare dashboard
# ("dictmaster"), or Workers Builds will fail the build.
name = "dictmaster"
main = "worker.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Run the Worker first ONLY for API/health paths; all other requests use
# assets-first serving + SPA fallback (index.html) as before.
run_worker_first = ["/api/*", "/health"]
# redeploy to pick up secret
